<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" role="img" aria-label="AgentStateStorage: the open session layer for AI agents">
<style>
  .t  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0A1324; }
  .s  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #46597A; }
  .d  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8393AE; }
  .m  { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  .eb { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; letter-spacing: 2px; fill: #8393AE; }
  .spark { stroke-dasharray: 2 40; stroke-linecap: round; animation: spark 2.2s linear infinite; }
  .spark.slow { animation-duration: 3.4s; }
  .march { stroke-dasharray: 7 7; animation: march 1.8s linear infinite; }
  .breathe { animation: breathe 4s ease-in-out infinite; }
  @keyframes spark { to { stroke-dashoffset: -84; } }
  @keyframes march { to { stroke-dashoffset: -28; } }
  @keyframes breathe { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .spark, .march, .breathe { animation: none; }
  }
</style>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.1" fill="#CDD6E8"/>
  </pattern>
  <radialGradient id="aur1" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#C4B5FD" stop-opacity=".35"/>
    <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="aur2" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#A5F3FC" stop-opacity=".35"/>
    <stop offset="1" stop-color="#A5F3FC" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#0891B2"/>
  </linearGradient>
  <!-- canvas units: a straight line has a zero-width bounding box, which
       would leave a bounding-box gradient unpainted -->
  <linearGradient id="span" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1000" y2="0">
    <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#0891B2"/>
  </linearGradient>
  <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D97706"/><stop offset="1" stop-color="#0284C7"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E293B" flood-opacity=".10"/>
  </filter>
  <filter id="bloom" x="-30%" y="-80%" width="160%" height="260%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
</defs>
<rect width="1040" height="430" rx="20" fill="#FBFCFF"/>
<ellipse cx="230" cy="250" rx="420" ry="360" fill="url(#aur1)"/>
<ellipse cx="840" cy="230" rx="420" ry="360" fill="url(#aur2)"/>
<rect width="1040" height="430" rx="20" fill="url(#dots)" opacity=".7"/>
<rect x="40" y="52" width="248" height="28" rx="14" fill="#0891B2" fill-opacity=".1" stroke="#0891B2" stroke-opacity=".55"/><text x="54" y="71" font-size="12.5" letter-spacing="2" class="m" fill="#0891B2">OPEN SOURCE · APACHE-2.0</text>
<text x="38" y="142" font-size="46" font-weight="800" letter-spacing="-1.4" class="t">Agent<tspan fill="url(#word)">State</tspan>Storage</text>
<text x="40" y="184" font-size="23" font-weight="650" class="t">The open session layer for AI agents</text>
<text x="40" y="222" font-size="16.5" class="s">Snapshot, fork, resume and erase an agent session —</text>
<text x="40" y="247" font-size="16.5" class="s">its history, memory, workspace and KV cache, together.</text>
<text x="40" y="272" font-size="16.5" class="s">On your infrastructure. Any engine. Any cloud.</text>
