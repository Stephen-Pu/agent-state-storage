<circle cx="49" cy="376" r="9" fill="#059669" fill-opacity=".18" stroke="#059669" stroke-width="1.4"/><path d="M45 376l2.8 2.9 5.2-5.6" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="381" font-size="14" class="s">works today</text><circle cx="176.6" cy="376" r="9" fill="none" stroke="#B45309" stroke-width="1.4"/><path d="M176.6 367a9 9 0 0 1 0 18z" fill="#B45309"/><text x="192.6" y="381" font-size="14" class="s">per framework</text><rect x="310.4" y="366" width="31" height="20" rx="10" fill="#B45309" fill-opacity=".14" stroke="#B45309" stroke-width="1.2"/><text x="317.4" y="380.5" font-size="12.5" font-weight="700" class="m" fill="#B45309">M2</text><text x="348.2" y="381" font-size="14" class="s">planned</text>
