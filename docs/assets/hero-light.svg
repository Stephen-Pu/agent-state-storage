<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="AgentStateStorage: the open session layer for AI agents">
<style>
  .t  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0A1324; }
  .s  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #46597A; }
  .d  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8393AE; }
  .m  { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  .flow  { stroke-dasharray: 5 9; animation: flow 1.6s linear infinite; }
  .pulse { animation: pulse 2.8s ease-in-out infinite; }
  @keyframes flow  { to { stroke-dashoffset: -28; } }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse { animation: none; }
  }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDF3FC"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0891B2"/><stop offset=".5" stop-color="#7C3AED"/>
    <stop offset="1" stop-color="#D97706"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#D3DEEE" stroke-width="1" opacity=".55"/>
  </pattern>
  <radialGradient id="aura" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#7C3AED" stop-opacity="0.12"/>
    <stop offset=".55" stop-color="#0891B2" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>
<rect width="1280" height="440" rx="18" fill="url(#bg)"/>
<rect width="1280" height="440" rx="18" fill="url(#grid)"/>
<ellipse cx="990" cy="220" rx="300" ry="210" fill="url(#aura)"/>
<g transform="translate(64,0)">
<rect x="0" y="86" width="268" height="30" rx="15" fill="#0891B2" fill-opacity=".1" stroke="#0891B2" stroke-opacity=".5"/>
<text x="16" y="106" font-size="13" letter-spacing="2" class="m" fill="#0891B2">OPEN SOURCE · APACHE-2.0</text>
<text x="0" y="178" font-size="58" font-weight="800" class="t" letter-spacing="-1.5">Agent<tspan fill="url(#brand)">State</tspan>Storage</text>
<text x="0" y="226" font-size="27" font-weight="600" class="t">The open session layer for AI agents</text>
<text x="0" y="266" font-size="18" class="s">Snapshot, fork, resume and erase an agent session —</text>
<text x="0" y="292" font-size="18" class="s">its KV, workspace and memory, together.</text>
<text x="0" y="318" font-size="18" class="s">On your infrastructure. Any engine. Any cloud.</text>
