<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Architecture: agents, SDK, session layer, state planes, spine, engines and storage">
<style>
  .t  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #EAF0FB; }
  .s  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9DB0D3; }
  .d  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #61739A; }
  .m  { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  .flow  { stroke-dasharray: 5 9; animation: flow 1.6s linear infinite; }
  .pulse { animation: pulse 2.8s ease-in-out infinite; }
  @keyframes flow  { to { stroke-dashoffset: -28; } }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse { animation: none; }
  }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05080F"/><stop offset="1" stop-color="#0B1530"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/>
    <stop offset="1" stop-color="#FBBF24"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1C2B4D" stroke-width="1" opacity=".55"/>
  </pattern>
  <radialGradient id="aura" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#A78BFA" stop-opacity="0.30"/>
    <stop offset=".55" stop-color="#22D3EE" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>
