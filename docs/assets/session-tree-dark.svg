<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img" aria-label="Session tree: snapshot, fork, resume after a crash, and cascading erase">
<style>
  .t  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #EAF0FB; }
  .s  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9DB0D3; }
  .d  { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #61739A; }
  .m  { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  .eb { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; letter-spacing: 2px; fill: #61739A; }
  .spark { stroke-dasharray: 2 40; stroke-linecap: round; animation: spark 2.2s linear infinite; }
  .spark.slow { animation-duration: 3.4s; }
  .march { stroke-dasharray: 7 7; animation: march 1.8s linear infinite; }
  .breathe { animation: breathe 4s ease-in-out infinite; }
  @keyframes spark { to { stroke-dashoffset: -84; } }
  @keyframes march { to { stroke-dashoffset: -28; } }
  @keyframes breathe { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .spark, .march, .breathe { animation: none; }
  }
</style>
<defs>
